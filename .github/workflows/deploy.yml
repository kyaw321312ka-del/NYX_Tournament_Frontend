
name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          : "${VITE_API_BASE_URL:?Set the VITE_API_BASE_URL repository variable}"
          npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Missing SSH private key}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH known hosts}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy dist to Namecheap
        env:
          SSH_HOST: ${{ secrets.NAMECHEAP_HOST }}
          SSH_USER: ${{ secrets.NAMECHEAP_USER }}
          SSH_PORT: ${{ secrets.NAMECHEAP_PORT }}
          DEPLOY_PATH: ${{ secrets.NAMECHEAP_DEPLOY_PATH }}
        run: |
          : "${SSH_HOST:?Missing SSH host}"
          : "${SSH_USER:?Missing SSH user}"
          : "${DEPLOY_PATH:?Missing deployment path}"

          rsync -az --no-owner --no-group --omit-dir-times \
            --exclude='.htaccess' \
            -e "ssh -p ${SSH_PORT:-22}" \
            dist/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH%/}/"
